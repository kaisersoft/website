<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020307">
  <meta name="description" content="KaiserChat – ein einfacher AI-Chat von KaiserSoft.">
  <title>KaiserChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="space-glow" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="brand" aria-label="KaiserChat">
      <div class="brand-mark"><span></span><span></span><span></span></div>
      <div class="brand-name">Kaiser<span>Chat</span></div>
      <div class="brand-subtitle">AI. Simple.</div>
    </header>

    <section class="chat" aria-live="polite">
      <div id="messages" class="messages"></div>
    </section>

    <form id="chat-form" class="composer">
      <textarea id="prompt" rows="1" maxlength="12000" placeholder="Was möchtest du wissen?" aria-label="Nachricht"></textarea>
      <button id="send" type="submit" aria-label="Nachricht absenden">
        <span>Absenden</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <div class="hint">KaiserChat · einfacher AI-Chat</div>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
