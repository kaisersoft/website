name: Deploy Kaisersoft Website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'voltdesk-landingpage/**'
      - '.github/workflows/deploy-voltdesk-landingpage.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update VoltDesk navigation and feature matrix
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path("voltdesk-landingpage")

          # Add the Features link to every existing landing-page HTML file.
          for path in root.glob("*.html"):
              if path.name == "features.html":
                  continue
              text = path.read_text(encoding="utf-8")
              if "./features.html" in text:
                  continue
              updated = text
              nav_match = re.search(r"(<nav\b[^>]*>)(.*?)(</nav>)", updated, flags=re.I | re.S)
              if nav_match:
                  link = '\n    <a href="./features.html">Features</a>'
                  updated = updated[:nav_match.end(2)] + link + updated[nav_match.end(2):]
              else:
                  header_match = re.search(r"(<header\b[^>]*>)(.*?)(</header>)", updated, flags=re.I | re.S)
                  if header_match:
                      link = '<a class="back" href="./features.html">Features</a>'
                      updated = updated[:header_match.end(2)] + link + updated[header_match.end(2):]
                  else:
                      body_match = re.search(r"<body[^>]*>", updated, flags=re.I)
                      if body_match:
                          link = '\n<nav style="padding:16px 24px;text-align:right"><a href="./features.html">Features</a></nav>'
                          updated = updated[:body_match.end()] + link + updated[body_match.end():]
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          # Recover the last known-good feature matrix if an earlier automation
          # accidentally dropped the QuantConnect column, then apply the final order.
          path = root / "features.html"
          text = path.read_text(encoding="utf-8")
          header_text = re.search(r"<thead>.*?</thead>", text, flags=re.S | re.I)
          if not header_text or "QuantConnect" not in header_text.group(0):
              text = subprocess.check_output([
                  "git", "show", "35ff30c1476229797f2c110991c3cece8479ab03:voltdesk-landingpage/features.html"
              ], text=True).replace("\r\n", "\n")

          text = text.replace(
              '<td class="price">Paid / Custom<span class="plan">Research &amp; Trading</span></td>',
              '<td class="price">$84/Monat<span class="plan">Quant Researcher</span></td>'
          )

          table_match = re.search(r"(<div class=\"matrix-wrap\"><table>)(.*?)(</table>)", text, flags=re.S)
          if not table_match:
              raise SystemExit("Features matrix table not found")
          table = table_match.group(2)

          # Final order by displayed monthly price, with VoltDesk kept first:
          # VoltDesk, thinkorswim, Sentry, Finviz, Neura, Stock Rover,
          # TradingView, Koyfin, QuantConnect, TrendSpider, TC2000, Trade Ideas.
          desired = [0,1,2,3,4,5,6,7,12,8,9,10,11]

          header = re.search(r"<thead>.*?</thead>", table, flags=re.S | re.I)
          hrow = re.search(r"<tr\b[^>]*>.*?</tr>", header.group(0), flags=re.S | re.I)
          hcells = re.findall(r"<th\b[^>]*>.*?</th>", hrow.group(0), flags=re.S | re.I)
          if len(hcells) != 13:
              raise SystemExit(f"Expected 13 header cells, found {len(hcells)}")
          new_hrow = "<tr>" + "".join(hcells[i] for i in desired) + "</tr>"
          table = table.replace(header.group(0), header.group(0).replace(hrow.group(0), new_hrow))

          body_match = re.search(r"<tbody>.*?</tbody>", table, flags=re.S | re.I)
          body = body_match.group(0)

          def reorder_body_row(m):
              row = m.group(0)
              cells = re.findall(r"<td\b[^>]*>.*?</td>", row, flags=re.S | re.I)
              if len(cells) != 13:
                  raise SystemExit(f"Expected 13 body cells, found {len(cells)}")
              attrs = re.match(r"<tr\b([^>]*)>", row, flags=re.S | re.I).group(1)
              return f"<tr{attrs}>" + "".join(cells[i] for i in desired) + "</tr>"

          new_body = re.sub(r"<tr\b[^>]*>.*?</tr>", reorder_body_row, body, flags=re.S | re.I)
          table = table.replace(body, new_body)
          path.write_text(text[:table_match.start(2)] + table + text[table_match.end(2):], encoding="utf-8")

      - name: Commit site updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voltdesk-landingpage .github/workflows/deploy-voltdesk-landingpage.yml
          if ! git diff --cached --quiet; then
            git commit -m "Fix VoltDesk feature matrix order and pricing"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css _site/
          cp -R js _site/
          cp -R voltdesk-landingpage _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
