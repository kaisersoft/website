name: VoltDesk live navigation and feature matrix update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update VoltDesk landing pages
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("voltdesk-landingpage")

          # Add the Features link to every existing HTML page without duplicating it.
          for path in root.glob("*.html"):
              if path.name == "features.html":
                  continue
              text = path.read_text(encoding="utf-8")
              if "./features.html" in text:
                  continue

              updated = text
              nav_match = re.search(r"(<nav\b[^>]*>)(.*?)(</nav>)", updated, flags=re.I | re.S)
              if nav_match:
                  nav_body = nav_match.group(2)
                  link = '\n    <a href="./features.html">Features</a>'
                  updated = updated[:nav_match.start(2)] + nav_body + link + updated[nav_match.end(2):]
              else:
                  header_match = re.search(r"(<header\b[^>]*>)(.*?)(</header>)", updated, flags=re.I | re.S)
                  if header_match:
                      link = '<a class="back" href="./features.html">Features</a>'
                      updated = updated[:header_match.end(2)] + link + updated[header_match.end(2):]
                  else:
                      # Legal/simple pages without a header still get a visible top link.
                      body_match = re.search(r"<body[^>]*>", updated, flags=re.I)
                      if body_match:
                          link = '\n<nav style="padding:16px 24px;text-align:right"><a href="./features.html">Features</a></nav>'
                          updated = updated[:body_match.end()] + link + updated[body_match.end():]

              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          # Reorder the Features matrix by displayed monthly paid-plan price.
          # VoltDesk remains first; QuantConnect ($84 / Quant Researcher) moves before TrendSpider.
          path = root / "features.html"
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              '<td class="price">Paid / Custom<span class="plan">Research &amp; Trading</span></td>',
              '<td class="price">$84/Monat<span class="plan">Quant Researcher</span></td>'
          )

          table_match = re.search(r"(<div class=\"matrix-wrap\"><table>)(.*?)(</table>)", text, flags=re.S)
          if not table_match:
              raise SystemExit("Features matrix table not found")

          table = table_match.group(2)
          desired = [0,1,2,3,4,5,6,7,11,8,9,10]

          def reorder_row(match, tag):
              row = match.group(0)
              cells = re.findall(fr"<{tag}\b[^>]*>.*?</{tag}>", row, flags=re.S | re.I)
              if len(cells) != 13:
                  return row
              return "<tr" + row.split("<tr",1)[1].split(">",1)[0] + ">" + "".join(cells[i] for i in desired) + "</tr>"

          # Header row: preserve first Capability cell, reorder the 12 product headers.
          header = re.search(r"<thead>.*?</thead>", table, flags=re.S | re.I)
          if not header:
              raise SystemExit("Features table header not found")
          hrow = re.search(r"<tr\b[^>]*>.*?</tr>", header.group(0), flags=re.S | re.I)
          hcells = re.findall(r"<th\b[^>]*>.*?</th>", hrow.group(0), flags=re.S | re.I)
          if len(hcells) == 13:
              new_hrow = "<tr>" + "".join(hcells[i] for i in desired) + "</tr>"
              new_header = header.group(0).replace(hrow.group(0), new_hrow)
              table = table.replace(header.group(0), new_header)

          # Reorder every body row's 13 cells in the same way.
          body_match = re.search(r"<tbody>.*?</tbody>", table, flags=re.S | re.I)
          if not body_match:
              raise SystemExit("Features table body not found")
          body = body_match.group(0)

          def body_row_reorder(m):
              row = m.group(0)
              cells = re.findall(r"<td\b[^>]*>.*?</td>", row, flags=re.S | re.I)
              if len(cells) != 13:
                  return row
              attrs = re.match(r"<tr\b([^>]*)>", row, flags=re.S | re.I).group(1)
              return f"<tr{attrs}>" + "".join(cells[i] for i in desired) + "</tr>"

          new_body = re.sub(r"<tr\b[^>]*>.*?</tr>", body_row_reorder, body, flags=re.S | re.I)
          table = table.replace(body, new_body)
          text = text[:table_match.start(2)] + table + text[table_match.end(2):]
          path.write_text(text, encoding="utf-8")

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voltdesk-landingpage .github/workflows/voltdesk-live-nav-update.yml
          git rm .github/workflows/voltdesk-live-nav-update.yml
          git add voltdesk-landingpage
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update VoltDesk features pricing and site navigation"
          git push
